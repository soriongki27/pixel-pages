<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="console">
    <header class="topbar">
      <h1 class="logo">PIXEL PAGES</h1>
      <p class="tagline">a q&amp;a writing journal</p>
      <div class="auth-bar">
        <button id="auth-open" class="btn auth-open" type="button">Sign in / Sign up</button>
        <div id="auth-user" class="auth-user hidden">
          <span id="auth-user-email" class="auth-user-email"></span>
          <button id="auth-logout" class="btn" type="button">Sign out</button>
        </div>
      </div>
      <nav class="nav">
        <button id="nav-write" class="nav-btn active" type="button">Write</button>
        <button id="nav-notebook" class="nav-btn" type="button">Notebook</button>
      </nav>
    </header>

    <!-- SIGN IN SCREEN -->
    <main id="view-signin" class="view hidden">
      <div class="auth-panel">
        <form id="signin-form" class="auth-form">
          <h2 class="label">Log in</h2>
          <label class="label" for="signin-email">Email</label>
          <input id="signin-email" class="auth-input" type="email" autocomplete="email" required />
          <label class="label" for="signin-password">Password</label>
          <input id="signin-password" class="auth-input" type="password" autocomplete="current-password" minlength="6" required />
          <p id="signin-error" class="auth-error" aria-live="polite"></p>
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Log in</button>
            <button id="signin-cancel" class="btn" type="button">Cancel</button>
          </div>
          <p class="auth-switch">
            New here?
            <button id="go-signup" class="auth-link" type="button">Create an account</button>
          </p>
        </form>
      </div>
    </main>

    <!-- SIGN UP SCREEN -->
    <main id="view-signup" class="view hidden">
      <div class="auth-panel">
        <form id="signup-form" class="auth-form">
          <h2 class="label">Create your account</h2>
          <label class="label" for="signup-email">Email</label>
          <input id="signup-email" class="auth-input" type="email" autocomplete="email" required />
          <label class="label" for="signup-password">Password</label>
          <input id="signup-password" class="auth-input" type="password" autocomplete="new-password" minlength="6" required />
          <p id="signup-error" class="auth-error" aria-live="polite"></p>
          <div class="auth-actions">
            <button class="btn btn-primary" type="submit">Sign up</button>
            <button id="signup-cancel" class="btn" type="button">Cancel</button>
          </div>
          <p class="auth-switch">
            Already have an account?
            <button id="go-signin" class="auth-link" type="button">Log in</button>
          </p>
        </form>
      </div>
    </main>

    <!-- WRITE SCREEN -->
    <main id="view-write" class="view">
      <section class="prompt-card">
        <span class="label">Today's Prompt</span>
        <p id="prompt-text" class="prompt-text">&hellip;</p>
        <button id="new-prompt" class="btn" type="button">New Prompt</button>
      </section>

      <section class="answer-block">
        <label class="label" for="answer">Your Answer</label>
        <textarea
          id="answer"
          class="answer-input"
          placeholder="Take your time. Write what you really think..."
          spellcheck="true"
        ></textarea>
        <div class="answer-footer">
          <span id="word-count" class="word-count">0 words</span>
          <button id="save-entry" class="btn btn-primary" type="button">Save Entry</button>
        </div>
        <p id="save-msg" class="save-msg" aria-live="polite"></p>
      </section>
    </main>

    <!-- NOTEBOOK SCREEN -->
    <main id="view-notebook" class="view hidden">
      <div class="notebook-head">
        <h2 class="label">Your Notebook</h2>
        <button id="export-all" class="btn" type="button">Export All</button>
      </div>
      <div id="entries" class="entries"></div>
      <p id="empty-note" class="empty-note hidden">
        No entries yet. Head to Write and answer your first prompt!
      </p>
    </main>

    <footer class="footer">
      <span id="entry-total">0 entries</span>
      <span>saved on this device only</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="prompts.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
